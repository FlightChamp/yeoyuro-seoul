# config/data_release.toml — 3-B 정차표 공개 정책 (D-112 사전 등록 docs/v2/preregistration_d112.md, 구현 D-112a)
#
# 공개 모드(로컬 개발 모드가 아닌 모든 실행)에서 3-B 노선은 아래 조건을 **모두** 만족할 때만 켜진다 (fail-closed).
#   C1 status = "허용" 이고 decision(결정 D 번호)이 있음
#   C2 evidence(이용허락 근거)가 있음
#   C3 enabled = true
#   C4 그 운영사 토큰이 Streamlit Secrets 에 있고 인증에 성공
#   C5 받은 파일 SHA-256 = 아래 sha256
#   C6 스키마·데이터 검사 통과 (행 수·열차 수가 아래 값과 같음)
# 하나라도 어긋나면 그 노선만 끈다. 공개 모드는 로컬 3-B 파일을 읽지 않는다.
#
# 이 파일에는 토큰을 쓰지 않는다. 토큰은 Streamlit Secrets 의 [k3b_remote.<운영사>] token 에만 둔다.
# D-107 보류 (2026-11-28): 모든 노선 enabled = false, status = "보류". 바꾸려면 새 D 번호로 커밋한다.

schema = 1

[operators.korail]
groups = ["GJ", "GC", "SB"]
repo = ""            # 비공개 저장소 "소유자/이름" — 활성화 때 채움
path = "korail_3b_korail.parquet"
ref = "main"
sha256 = ""
rows = 0

[operators.arex]
groups = ["AR"]
repo = ""
path = "korail_3b_arex.parquet"
ref = "main"
sha256 = ""
rows = 0

[groups.GJ]
operator = "korail"
enabled = false
status = "보류"
decision = "D-107"
evidence = ""
trains = 0

[groups.GC]
operator = "korail"
enabled = false
status = "보류"
decision = "D-107"
evidence = ""
trains = 0
depends_on = ["GJ"]  # D-112 5절: 경춘 열차는 청량리·회기·중랑에서 GJ_ 노드·GJC 간선을 지난다

[groups.SB]
operator = "korail"
enabled = false
status = "보류"
decision = "D-107"
evidence = ""
trains = 0

[groups.AR]
operator = "arex"
enabled = false
status = "보류"
decision = "D-107"
evidence = ""
trains = 0
